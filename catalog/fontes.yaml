# Fontes: the catalogue of sources (Spec C2, C3, C6, C12, C18, C23, C42).
# status active  = an adapter exists and runs. status planned = on the roadmap, shown in the coverage matrix as planned.
# reliability    = Admiralty scale A to F for the source itself, with reason and date. It is never combined with
#                  the credibility of a single fact (Spec C23).
# license        = an id from citrinitas/athanor/licenses.py; `restricted` until the terms are verified.
fontes:
  fama:
    name: GDELT 2.0 Events, Mentions and Global Knowledge Graph
    homepage: https://www.gdeltproject.org/
    license: GDELT-terms
    access: open
    cadence: 15 minutes
    reliability: C
    reliability_reason: Machine-coded from news text in 65 languages; complete as a record of what is reported, noisy as a record of what happened (2026-11-18).
    quaestiones: [q-force-reporting, q-language-gap]
    budget: {disk_gb: 48, runtime_s_day: 7200, download_mb_day: 3000}
    cells:
      - {domain: security, classis: reported, levels: [world, country, region, place], times: [live]}
      - {domain: politics, classis: reported, levels: [world, country, region, place], times: [live]}
      - {domain: information, classis: reported, levels: [world, country], times: [live]}
  kev:
    name: CISA Known Exploited Vulnerabilities Catalog
    homepage: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    license: CC0-1.0
    access: open
    cadence: daily
    reliability: B
    reliability_reason: Official catalogue; an entry requires evidence of exploitation; additions can lag the first exploitation (2026-11-18).
    quaestiones: [q-exploited-vulnerabilities]
    budget: {disk_gb: 1, runtime_s_day: 600, download_mb_day: 200}
    cells:
      - {domain: network, classis: official, levels: [world], times: [live, historic]}

  # ---- planned: access and licence are verified when the adapter is built ----
  ucdp:
    {status: planned, name: UCDP Georeferenced Event Dataset and Candidate Events, homepage: "https://ucdp.uu.se/", license: restricted, access: key,
     cells: [{domain: security, classis: measured, levels: [world, country, region, place], times: [live, historic]}]}
  hapi:
    {status: planned, name: HDX Humanitarian API, homepage: "https://hapi.humdata.org/", license: restricted, access: key,
     cells: [{domain: security, classis: measured, levels: [country, region], times: [historic]},
             {domain: food, classis: official, levels: [country, region], times: [live, future]},
             {domain: population, classis: official, levels: [country, region], times: [live, historic]}]}
  views:
    {status: planned, name: VIEWS conflict forecasts, homepage: "https://viewsforecasting.org/", license: restricted, access: open,
     cells: [{domain: security, classis: expected, levels: [country, place], times: [future]}]}
  portwatch:
    {status: planned, name: IMF PortWatch chokepoint and port transits, homepage: "https://portwatch.imf.org/", license: restricted, access: open,
     cells: [{domain: economy, classis: measured, levels: [world, place], times: [live, historic]},
             {domain: mobility, classis: measured, levels: [place], times: [live, historic]}]}
  comtrade:
    {status: planned, name: UN Comtrade, homepage: "https://comtradeplus.un.org/", license: restricted, access: key,
     cells: [{domain: economy, classis: official, levels: [country], times: [historic]}]}
  firms:
    {status: planned, name: NASA FIRMS active fires, homepage: "https://firms.modaps.eosdis.nasa.gov/", license: US-PD, access: key,
     cells: [{domain: climate, classis: measured, levels: [country, place], times: [live, historic]}]}
  energy_charts:
